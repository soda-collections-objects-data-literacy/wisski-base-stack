services:
  drupal:
    image: ghcr.io/soda-collections-objects-data-literacy/wisski-base-image-${MODE:-production}:${WISSKI_BASE_IMAGE_VERSION:-latest}
    container_name: ${SERVICE_NAME}--drupal
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # this path is important for snapshots of the wisski components
      - drupal-root:/opt/drupal
      - soda_scs_manager_deployment_shared-data:/var/private-files
    environment:
      DB_DRIVER: ${DB_DRIVER}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DRUPAL_DOMAIN: ${DRUPAL_DOMAIN}
      DRUPAL_LOCALE: ${DRUPAL_LOCALE}
      DRUPAL_PASSWORD: ${DRUPAL_PASSWORD}
      DRUPAL_SITE_NAME: ${DRUPAL_SITE_NAME}
      DRUPAL_TRUSTED_HOST: ${DRUPAL_TRUSTED_HOST}
      DRUPAL_USER: ${DRUPAL_USER}
      KEYCLOAK_ADMIN_GROUP: ${KEYCLOAK_ADMIN_GROUP}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_USER_GROUP: ${KEYCLOAK_USER_GROUP}
      MODE: ${MODE:-production}
      OPENID_CONNECT_CLIENT_SECRET: ${OPENID_CONNECT_CLIENT_SECRET}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      SERVICE_NAME: ${SERVICE_NAME}
      TS_PASSWORD: ${TS_PASSWORD}
      TS_READ_URL: ${TS_READ_URL}
      TS_REPOSITORY: ${TS_REPOSITORY}
      TS_TOKEN: ${TS_TOKEN}
      TS_USERNAME: ${TS_USERNAME}
      TS_WRITE_URL: ${TS_WRITE_URL}
      USER_GROUPS: ${USER_GROUPS}
      WISSKI_DEFAULT_DATA_MODEL_VERSION: ${WISSKI_DEFAULT_DATA_MODEL_VERSION:-1.x-dev}
      WISSKI_DEFAULT_GRAPH: ${WISSKI_DEFAULT_GRAPH}
      WISSKI_STARTER_VERSION: ${WISSKI_STARTER_VERSION:-1.x-dev}
    networks:
      - reverse-proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=reverse-proxy"
      - "traefik.http.routers.${SERVICE_NAME}-drupal.rule=Host(`raw.${DRUPAL_DOMAIN}`)"
      - "traefik.http.routers.${SERVICE_NAME}-drupal.entrypoints=web,websecure"
      - "traefik.http.routers.${SERVICE_NAME}-drupal.tls=true"
      - "traefik.http.routers.${SERVICE_NAME}-drupal.tls.certresolver=le"
      - "traefik.http.services.${SERVICE_NAME}-drupal.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Host: ${DRUPAL_DOMAIN}", "http://localhost/health"]
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 180s
  redis:
    image: redis:7.4-alpine
    container_name: ${SERVICE_NAME}--redis
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1000 --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - internal
    labels:
      - "traefik.enable=false"

  varnish:
    image: ghcr.io/soda-collections-objects-data-literacy/scs-varnish:${SCS_VARNISH_IMAGE_VERSION:-latest}
    container_name: ${SERVICE_NAME}--varnish
    restart: always
    depends_on:
      drupal:
        condition: service_started
    environment:
      - VARNISH_SIZE=${VARNISH_SIZE}
      - VARNISH_BACKEND_HOST=${SERVICE_NAME}--drupal
      - VARNISH_BACKEND_PORT=${VARNISH_PORT}
    tmpfs:
      - /var/lib/varnish/varnishd:exec,uid=999,gid=999
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    ulimits:
      memlock:
        soft: 536870912
        hard: 536870912
    healthcheck:
      test: ["CMD", "varnishstat", "-1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - reverse-proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=reverse-proxy"
      - "traefik.http.routers.${SERVICE_NAME}--varnish.middlewares=https-redirect"
      - "traefik.http.routers.${SERVICE_NAME}--varnish.rule=Host(`${DRUPAL_DOMAIN}`)"
      - "traefik.http.routers.${SERVICE_NAME}--varnish.entrypoints=web,websecure"
      - "traefik.http.routers.${SERVICE_NAME}--varnish.tls=true"
      - "traefik.http.routers.${SERVICE_NAME}--varnish.tls.certresolver=le"
      - "traefik.http.services.${SERVICE_NAME}--varnish.loadbalancer.server.port=80"

networks:
  reverse-proxy:
    external: true
  internal:
    driver: bridge

volumes:
  drupal-root:
    name: ${SERVICE_NAME}--drupal-root
  redis-data:
    name: ${SERVICE_NAME}--redis-data
  soda_scs_manager_deployment_shared-data:
    external: true

