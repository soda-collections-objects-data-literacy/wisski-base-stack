services:
  drupal:
    image: ghcr.io/soda-collections-objects-data-literacy/wisski-base-image-${MODE:-production}:${WISSKI_BASE_IMAGE_VERSION:-latest}
    container_name: ${SERVICE_NAME}--drupal
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # The codebase is immutable in the image; only site state and private
      # files persist across container recreations.
      - drupal-sites:/opt/drupal/web/sites
      - drupal-private-files:/opt/drupal/private-files
    environment:
      DB_DRIVER: ${DB_DRIVER}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DRUPAL_DOMAIN: ${DRUPAL_DOMAIN}
      DRUPAL_LOCALE: ${DRUPAL_LOCALE}
      DRUPAL_PASSWORD: ${DRUPAL_PASSWORD}
      DRUPAL_PRIVATE_FILES_DIR: ${DRUPAL_PRIVATE_FILES_DIR:-/opt/drupal/private-files}
      DRUPAL_PROXY_ADDRESSES: ${DRUPAL_PROXY_ADDRESSES:-auto}
      DRUPAL_SITE_NAME: ${DRUPAL_SITE_NAME}
      DRUPAL_TRUSTED_HOSTS: ${DRUPAL_TRUSTED_HOSTS}
      DRUPAL_USER: ${DRUPAL_USER}
      KEYCLOAK_ADMIN_GROUP: ${KEYCLOAK_ADMIN_GROUP}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_USER_GROUP: ${KEYCLOAK_USER_GROUP}
      MODE: ${MODE:-production}
      NEXTCLOUD_BASE_URL: ${NEXTCLOUD_BASE_URL}
      NEXTCLOUD_LOGIN_NAME: ${NEXTCLOUD_LOGIN_NAME}
      NEXTCLOUD_APP_PASSWORD: ${NEXTCLOUD_APP_PASSWORD}
      OPENID_CONNECT_CLIENT_SECRET: ${OPENID_CONNECT_CLIENT_SECRET}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      SERVICE_NAME: ${SERVICE_NAME}
      TS_PASSWORD: ${TS_PASSWORD}
      TS_READ_URL: ${TS_READ_URL}
      TS_REPOSITORY: ${TS_REPOSITORY}
      TS_TOKEN: ${TS_TOKEN}
      TS_USERNAME: ${TS_USERNAME}
      TS_WRITE_URL: ${TS_WRITE_URL}
      USER_GROUPS: ${USER_GROUPS}
      # Recipe versions are baked into the image; these act as flags
      # (non-empty = apply the recipe on first install).
      WISSKI_DEFAULT_DATA_MODEL_VERSION: ${WISSKI_DEFAULT_DATA_MODEL_VERSION:-true}
      WISSKI_DEFAULT_GRAPH: ${WISSKI_DEFAULT_GRAPH}
      WISSKI_STARTER_VERSION: ${WISSKI_STARTER_VERSION:-true}
    networks:
      - reverse-proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=reverse-proxy"
      # Internal reverse-proxy traffic: no rate limit (higher priority than external router below).
      - "traefik.http.routers.${SERVICE_NAME}-drupal-internal.rule=Host(`raw.${DRUPAL_DOMAIN}`) && (ClientIP(`172.16.0.0/12`) || ClientIP(`192.168.0.0/16`) || ClientIP(`10.0.0.0/8`) || ClientIP(`127.0.0.1/32`) || ClientIP(`::1/128`) || ClientIP(`fd00::/8`))"
      - "traefik.http.routers.${SERVICE_NAME}-drupal-internal.entrypoints=websecure"
      - "traefik.http.routers.${SERVICE_NAME}-drupal-internal.priority=100"
      - "traefik.http.routers.${SERVICE_NAME}-drupal-internal.tls=true"
      - "traefik.http.routers.${SERVICE_NAME}-drupal-internal.tls.certresolver=le"
      - "traefik.http.routers.${SERVICE_NAME}-drupal-internal.service=${SERVICE_NAME}-drupal"
      # External traffic (raw bypass path): rate limit.
      - "traefik.http.routers.${SERVICE_NAME}-drupal.rule=Host(`raw.${DRUPAL_DOMAIN}`)"
      - "traefik.http.routers.${SERVICE_NAME}-drupal.entrypoints=websecure"
      - "traefik.http.routers.${SERVICE_NAME}-drupal.priority=10"
      - "traefik.http.routers.${SERVICE_NAME}-drupal.middlewares=rate-limit-high@docker"
      - "traefik.http.routers.${SERVICE_NAME}-drupal.tls=true"
      - "traefik.http.routers.${SERVICE_NAME}-drupal.tls.certresolver=le"
      - "traefik.http.services.${SERVICE_NAME}-drupal.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Host: ${DRUPAL_DOMAIN}", "http://localhost/health"]
      interval: 15s
      timeout: 60s
      retries: 30
      start_period: 120s
  redis:
    image: redis:${REDIS_IMAGE_VERSION:-8-alpine}
    container_name: ${SERVICE_NAME}--redis
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1000 --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - internal
    labels:
      - "traefik.enable=false"

  varnish:
    image: ghcr.io/soda-collections-objects-data-literacy/scs-varnish:${VARNISH_IMAGE_VERSION:-latest}
    container_name: ${SERVICE_NAME}--varnish
    restart: always
    depends_on:
      drupal:
        condition: service_started
    environment:
      - VARNISH_SIZE=${VARNISH_SIZE:-512M}
      - VARNISH_BACKEND_HOST=${SERVICE_NAME}--drupal
      - VARNISH_BACKEND_PORT=${VARNISH_BACKEND_PORT:-80}
    tmpfs:
      - /var/lib/varnish/varnishd:exec,uid=999,gid=999
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    ulimits:
      memlock:
        soft: 536870912
        hard: 536870912
    healthcheck:
      test: ["CMD", "varnishstat", "-1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - reverse-proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=reverse-proxy"
      # Internal reverse-proxy traffic: no rate limit (higher priority than external router below).
      - "traefik.http.routers.${SERVICE_NAME}--varnish-internal.rule=Host(`${DRUPAL_DOMAIN}`) && (ClientIP(`172.16.0.0/12`) || ClientIP(`192.168.0.0/16`) || ClientIP(`10.0.0.0/8`) || ClientIP(`127.0.0.1/32`) || ClientIP(`::1/128`) || ClientIP(`fd00::/8`))"
      - "traefik.http.routers.${SERVICE_NAME}--varnish-internal.entrypoints=websecure"
      - "traefik.http.routers.${SERVICE_NAME}--varnish-internal.priority=100"
      - "traefik.http.routers.${SERVICE_NAME}--varnish-internal.tls=true"
      - "traefik.http.routers.${SERVICE_NAME}--varnish-internal.tls.certresolver=le"
      - "traefik.http.routers.${SERVICE_NAME}--varnish-internal.service=${SERVICE_NAME}--varnish"
      # External traffic: rate limit.
      - "traefik.http.routers.${SERVICE_NAME}--varnish.rule=Host(`${DRUPAL_DOMAIN}`)"
      - "traefik.http.routers.${SERVICE_NAME}--varnish.entrypoints=websecure"
      - "traefik.http.routers.${SERVICE_NAME}--varnish.priority=10"
      - "traefik.http.routers.${SERVICE_NAME}--varnish.middlewares=rate-limit-high@docker"
      - "traefik.http.routers.${SERVICE_NAME}--varnish.tls=true"
      - "traefik.http.routers.${SERVICE_NAME}--varnish.tls.certresolver=le"
      - "traefik.http.services.${SERVICE_NAME}--varnish.loadbalancer.server.port=80"

networks:
  reverse-proxy:
    external: true
  internal:
    driver: bridge

volumes:
  drupal-sites:
    name: ${SERVICE_NAME}--drupal-sites
  drupal-private-files:
    name: ${SERVICE_NAME}--drupal-private-files
  redis-data:
    name: ${SERVICE_NAME}--redis-data
